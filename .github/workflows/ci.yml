name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Changed-file formatting and whitespace
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm format:check:changed

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: File-size report
        run: node scripts/checkFileSize.mjs

  docker-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glantri_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glantri_test
        run: pnpm --filter @glantri/database exec prisma migrate deploy

      - name: Run integration tests
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/glantri_test
        run: pnpm --filter @glantri/database test

      - name: Build API image
        run: docker build -t glantri-api-test -f apps/api/Dockerfile .

      - name: Build Web image
        run: docker build -t glantri-web-test -f apps/web/Dockerfile .

      - name: Start API container
        run: |
          docker run -d --name api-test \
            --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@localhost:5432/glantri_test" \
            -e WEB_ORIGIN="http://localhost:3000" \
            -e NODE_ENV="production" \
            glantri-api-test

      - name: Start Web container
        run: |
          docker run -d --name web-test \
            --network host \
            -e API_UPSTREAM_URL="http://localhost:4000" \
            -e NODE_ENV="production" \
            glantri-web-test

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:4000/ready; then
              echo ""
              echo "Readiness check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/12 failed, retrying in 5s..."
            sleep 5
          done
          echo "API failed to start after 60s. Container logs:"
          docker logs api-test
          exit 1

      - name: Wait for Web to be ready
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "Web started on attempt $i"
              exit 0
            fi
            echo "Attempt $i/12 failed, retrying in 5s..."
            sleep 5
          done
          echo "Web failed to start after 60s. Container logs:"
          docker logs web-test
          exit 1

      - name: Start production-shape HTTPS browser origin
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/glantri-ci-key.pem \
            -out /tmp/glantri-ci-cert.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -days 1
          HTTPS_PROXY_TARGET="http://localhost:3000" \
            HTTPS_PROXY_PORT="3443" \
            HTTPS_PROXY_CERT="/tmp/glantri-ci-cert.pem" \
            HTTPS_PROXY_KEY="/tmp/glantri-ci-key.pem" \
            node scripts/testHttpsReverseProxy.mjs \
            > /tmp/glantri-ci-https-proxy.log 2>&1 &
          for i in $(seq 1 12); do
            if curl -kfsS -o /dev/null https://localhost:3443; then
              echo "HTTPS browser origin started on attempt $i"
              exit 0
            fi
            echo "Attempt $i/12 failed, retrying in 5s..."
            sleep 5
          done
          echo "HTTPS browser origin failed to start after 60s."
          cat /tmp/glantri-ci-https-proxy.log
          exit 1

      - name: Install Playwright browsers
        run: pnpm --filter @glantri/web exec playwright install --with-deps chromium webkit

      - name: Run Playwright smoke tests
        env:
          PLAYWRIGHT_BASE_URL: https://localhost:3443
          PLAYWRIGHT_API_URL: http://localhost:4000
          PLAYWRIGHT_BROWSER_API_URL: https://localhost:3443/api
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: "1"
        run: pnpm --filter @glantri/web exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
