name: Implementation task
description: Define a ready, owned, and verifiable Glantri implementation slice
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Complete enough detail that an agent can work without inventing scope, rules, or a development baseline.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the user-visible or operational result.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why now
      description: Explain impact and priority.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List what is in scope and explicitly out of scope.
      placeholder: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership and coordination
      description: Name the primary area, affected areas, owner/integration owner, and reserved hotspots.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Accepted baseline and Git authority
      description: Give exact branch/SHA, intended task branch/worktree, local/push/PR authority, and confirmed PR target if any.
    validations:
      required: true
  - type: textarea
    id: required_reading
    attributes:
      label: Required reading
      description: List exact repository paths needed for this task. AGENTS.md is always required; do not say read all architecture docs.
      placeholder: |
        - AGENTS.md
        - docs/area-or-process-document-required-for-this-task.md
    validations:
      required: true
  - type: textarea
    id: rule_basis
    attributes:
      label: Rule basis
      description: Cite source evidence, conflicts, approved rulings/deviations, and rule status. Use Not rule-dependent if applicable.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Contracts affected
      description: List API, schema, persistence, event, command, synchronization, and UI read-model effects.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance examples and dimensions
      description: Give concrete scenarios and apply docs/process/task-contract.md to every dimension.
      placeholder: |
        Functional: Required / Regression only / Not applicable / Needs decision
        - Criteria and examples:

        Mechanical/rules: Required / Regression only / Not applicable / Needs decision
        - Criteria and examples:

        Presentation: Required / Regression only / Not applicable / Needs decision
        - Criteria and examples:

        Information-flow/privacy: Required / Regression only / Not applicable / Needs decision
        - Criteria and examples:

        Product quality: Required / Regression only / Not applicable / Needs decision
        - Criteria and examples:

        Perspective matrix: Required / Regression only / Not applicable / Needs decision
        - GM, actor/Player A, target/Player B, uninvolved player, and other materially different views:
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List proportionate evidence and use Not applicable with a reason instead of empty categories.
      placeholder: |
        Unit/component tests:
        Mechanical/rules examples or golden tests:
        Integration/API/contract tests:
        Information-flow/sanitization tests:
        Synthetic browser/Playwright evidence:
        Isolated development-browser/manual evidence, only when required:
        Reload/history/undo/stale-state checks:
        Accessibility/responsive checks:
        Migration/compatibility checks:
        Performance/security checks:
        Required CI jobs:
        Product-owner acceptance script:
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and integration order
      description: List blockers, upstream contracts, dependent work, hotspot schedule, and merge order.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Product-owner decisions
      description: List unresolved product/rule/UX decisions or enter None.
    validations:
      required: true
  - type: textarea
    id: integration_plan
    attributes:
      label: Large or cross-area integration plan
      description: If unusually large/high-risk/cross-area, explain why it cannot be sliced and give contract order, hotspot owners, review, verification, compatibility, rollback, and follow-ups.
